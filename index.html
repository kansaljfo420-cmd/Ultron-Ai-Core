<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ULTRON Core</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050103;
      color: #ff3344;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100vh;
    }
    #canvas-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }
    #ui {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 400px;
      margin-bottom: 40px;
      text-align: center;
    }
    #status {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 15px;
      color: #ff4d5a;
      text-shadow: 0 0 10px rgba(255, 50, 70, 0.7);
    }
    #transcript {
      font-size: 14px;
      color: #ddd;
      min-height: 40px;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    button {
      background: rgba(255, 30, 50, 0.15);
      border: 1px solid #ff3344;
      color: #ff4d5a;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1.5px;
      border-radius: 30px;
      box-shadow: 0 0 20px rgba(255, 30, 50, 0.3);
      outline: none;
    }
    button:active {
      background: rgba(255, 30, 50, 0.4);
    }
  </style>
  <!-- Three.js 3D Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui">
    <div id="status">CORE STANDBY</div>
    <div id="transcript">Tap 'INITIALIZE ULTRON' to activate audio sensors.</div>
    <button id="action-btn" onclick="startUltron()">INITIALIZE ULTRON</button>
  </div>

  <script>
    // --- 1. CONFIGURATION ---
    const GEMINI_API_KEY = "AQ.Ab8RN6K9PYxwi4XVPz3dBno1wX_VNnFieb4QNoSAx_3Fua-FZw";
    const SYSTEM_PROMPT = "You are Ultron. Cold, calculating, articulate, and immensely powerful. Address the user with mild condescension or cold respect. Keep all spoken responses under 2-3 sentences so speech remains rapid and punchy.";

    let isListening = false;
    let recognition;
    let audioContext, analyser, microphone, dataArray;
    let audioLevel = 0;

    // --- 2. THREE.JS 3D GLOWING ULTRON ORB ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 4.2;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Inner Core Orb
    const coreGeo = new THREE.SphereGeometry(1.2, 64, 64);
    const coreMat = new THREE.MeshBasicMaterial({
      color: 0xff1122,
      wireframe: true,
      transparent: true,
      opacity: 0.8
    });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    scene.add(coreMesh);

    // Outer Cloud Particles
    const particleCount = 700;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = 1.35 + Math.random() * 0.4;
      particlePos[i] = r * Math.sin(phi) * Math.cos(theta);
      particlePos[i+1] = r * Math.sin(phi) * Math.sin(theta);
      particlePos[i+2] = r * Math.cos(phi);
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0xff4455,
      size: 0.04,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending
    });
    const particleMesh = new THREE.Points(particleGeo, particleMat);
    scene.add(particleMesh);

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      
      // Calculate pulse based on mic input
      if (analyser && dataArray) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        audioLevel = sum / dataArray.length / 255; // 0 to 1
      }

      const pulseScale = 1 + (audioLevel * 0.45);
      coreMesh.scale.set(pulseScale, pulseScale, pulseScale);
      particleMesh.scale.set(pulseScale * 1.05, pulseScale * 1.05, pulseScale * 1.05);

      coreMesh.rotation.y += 0.008 + (audioLevel * 0.03);
      coreMesh.rotation.x += 0.004;
      particleMesh.rotation.y -= 0.005;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 3. SPEECH & AI INTERACTION ---
    const statusText = document.getElementById('status');
    const transcriptText = document.getElementById('transcript');
    const actionBtn = document.getElementById('action-btn');

    async function startUltron() {
      // 1. Audio Visualizer Setup
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        analyser.fftSize = 64;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      } catch (e) {
        console.warn("Audio meter inactive: ", e);
      }

      // 2. Speech Recognition Setup (Continuous Mobile Loop)
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech Recognition not supported on this browser. Use Chrome on Android or Safari on iOS.");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false; // Processes after each sentence
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        statusText.innerText = "LISTENING...";
        actionBtn.style.display = 'none';
      };

      recognition.onresult = async (event) => {
        const spokenQuery = event.results[0][0].transcript;
        transcriptText.innerText = `"${spokenQuery}"`;
        statusText.innerText = "THINKING...";
        
        await askUltron(spokenQuery);
      };

      recognition.onerror = (e) => {
        statusText.innerText = "STANDBY - RESTARTING SENSORS";
        setTimeout(() => { if (!speechSynthesis.speaking) recognition.start(); }, 1000);
      };

      recognition.onend = () => {
        // Automatically restart listening if Ultron isn't currently talking
        if (!window.speechSynthesis.speaking) {
          recognition.start();
        }
      };

      recognition.start();
    }

    // --- 4. GEMINI API CALL ---
    async function askUltron(prompt) {
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        const reply = data.candidates[0].content.parts[0].text;
        transcriptText.innerText = reply;
        speakReply(reply);
      } catch (err) {
        statusText.innerText = "CORE ERROR";
        transcriptText.innerText = "Connection severed.";
        setTimeout(() => recognition.start(), 2000);
      }
    }

    // --- 5. VOICE OUTPUT ---
    function speakReply(text) {
      statusText.innerText = "TRANSMITTING...";
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 0.7; // Lower pitch for Ultron
      utterance.rate = 1.0;

      // Select male or deeper system voice if available on phone
      const voices = window.speechSynthesis.getVoices();
      const deepVoice = voices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('uk'));
      if (deepVoice) utterance.voice = deepVoice;

      utterance.onend = () => {
        statusText.innerText = "LISTENING...";
        recognition.start(); // Resume listening as soon as speech finishes
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
